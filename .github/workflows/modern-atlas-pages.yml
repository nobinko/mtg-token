name: Publish Modern Atlas

on:
  push:
    branches: [main]
    paths:
      - 'reports/modern-meta-2026-10-01/**'
      - '.github/workflows/modern-atlas-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: modern-atlas-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate the fixed guide
        run: node reports/modern-meta-2026-10-01/validate.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Collect the guide files
        shell: bash
        run: |
          set -euo pipefail
          guide_source='reports/modern-meta-2026-10-01'
          guide_output="$RUNNER_TEMP/modern-atlas-site"
          mkdir -p "$guide_output"
          cp "$guide_source"/{index.html,data.js,styles.css,app.js,favicon.svg,README.md,はじめに.txt,provenance.json,verification.json} "$guide_output/"
          cp -R "$guide_source/decklists" "$guide_source/images" "$guide_output/"
      - name: Upload the guide
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/modern-atlas-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the guide
        id: deployment
        uses: actions/deploy-pages@v5
